name: CI

on:
  push:
  workflow_dispatch:

env:
  # gebeer/shitty-optchat, the reference implementation the parity test runs against
  REFERENCE_SHA: 955394fa61a983c02f5d3ebde4ad857f98630ea6

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # video uploads are cut into frames with ffmpeg (SPEC "Media"), and their tests run it
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Lint
        run: bun run lint

      - name: Lint (Effect)
        run: bun run lint:effect -- --format github-actions

      # Impeccable's design anti-pattern detector (the /impeccable skill's `detect`) over web/
      - name: Lint (design)
        run: bun run lint:design -- --format github-actions

      - name: Test
        run: bun run test

  # the web UI on the real server with a fake claude, in Chromium at 360 px (web/e2e)
  web-e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # video uploads are cut into frames with ffmpeg (SPEC "Media"), and their tests run it
      - name: Install ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: cd web && bunx playwright install --with-deps chromium

      - name: Build the web UI and run the end-to-end tests
        run: cd web && bun run e2e

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results

  kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bend
        run: |
          sh kernel/install-bend.sh
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"

      - name: The committed kernel.mjs is what kernel.bend compiles to
        run: |
          cd kernel && bend kernel.bend -o kernel.mjs
          git diff --exit-code kernel.mjs

      # --verdict re-checks with BendTT, a kernel proven in Lean: it needs Lean's toolchain, and Bend
      # builds that kernel once into ~/.bend/bendtt
      - name: Cache Lean and the BendTT build
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            ~/.bend/bendtt
          key: lean-v4.34.0-${{ hashFiles('kernel/install-bend.sh') }}

      - name: Install Lean v4.34.0
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
              | sh -s -- -y --no-modify-path --default-toolchain leanprover/lean4:v4.34.0
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Every law in LAWS.bend is proven, also by the Lean-proven kernel
        run: cd kernel && bend PROOF.bend --verdict | tee /dev/stderr | grep -qx "ALL PROOFS CHECK"

  parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout the reference
        uses: actions/checkout@v4
        with:
          repository: gebeer/shitty-optchat
          ref: ${{ env.REFERENCE_SHA }}
          path: reference

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Parity with the reference
        run: REF="$GITHUB_WORKSPACE/reference" bun run parity
