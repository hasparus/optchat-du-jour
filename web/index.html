<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>optchat</title>
    <script>
      // the theme before the first paint: the saved choice, else the system's
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch {}
      // the design direction on trial (src/lib/look.ts): ?variant=a|b|c, kept; ?variant= clears it
      (() => {
        const ok = (v) => v === "a" || v === "b" || v === "c";
        const asked = new URLSearchParams(location.search).get("variant");
        let kept = null;
        try {
          if (asked !== null) ok(asked) ? localStorage.setItem("variant", asked) : localStorage.removeItem("variant");
          kept = localStorage.getItem("variant");
        } catch {}
        const v = asked ?? kept;
        if (ok(v)) document.documentElement.dataset.variant = v;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
