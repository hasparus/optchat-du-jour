<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#fbfdfc" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- the two faces every screen sets first (src/fonts.css), fetched with the page rather than after its CSS -->
    <link rel="preload" href="./node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./node_modules/@fontsource/commit-mono/files/commit-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <title>optchat</title>
    <script>
      // the theme before the first paint: the saved choice, else the system's
      try {
        const saved = localStorage.getItem("theme");
        const dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
        // the status bar takes the sheet's colour (index.css --background) before main.tsx syncs it
        if (dark) document.querySelector('meta[name="theme-color"]').setAttribute("content", "#111311");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
